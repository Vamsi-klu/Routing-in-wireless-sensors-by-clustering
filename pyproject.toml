[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "wsn-routing-clustering"
version = "1.0.0"
description = "Wireless Sensor Network Routing Simulation with Clustering Protocols"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "WSN Research Team"}
]
keywords = ["wireless sensor networks", "routing", "clustering", "LEACH", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking"
]

dependencies = [
    "numpy==1.24.3",
    "matplotlib==3.7.1",
    "PyYAML==6.0",
    "scipy==1.10.1",
    "pandas==2.0.1",
    "networkx==3.1"
]

[project.optional-dependencies]
dev = [
    "pytest==7.3.1",
    "pytest-cov==4.0.0",
    "coverage==7.2.5"
]

[project.urls]
Homepage = "https://github.com/wsn-routing/Routing-in-wireless-sensors-by-clustering"
Repository = "https://github.com/wsn-routing/Routing-in-wireless-sensors-by-clustering"

[tool.setuptools]
packages = ["src", "visualization", "examples"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["src", "visualization"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]
